name: Riot Scouting Cronjob

on:
  schedule:
    # Runs automatically every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  run-scout:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit the updated JSON file

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Scouting Script
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python scout.py

      - name: Commit Updated Database
        run: |
          git config --global user.name "ScoutBot"
          git config --global user.email "scoutbot@actions.github.com"
          git add teams.json
          git commit -m "chore: auto-update discovered game IDs" || echo "No new games found to commit."
          git push
